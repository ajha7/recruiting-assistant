[project]
name = "recruiting-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "streamlit",
    "python-dotenv",
    "openai>=3.49.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
